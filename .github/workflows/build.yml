name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1

      - name: Generate project
        run: xcodegen generate

      - name: Build
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}
        run: |
          xcodebuild -version
          # tag 构建时用 tag 作为 App 版本号（v0.2.0 → 0.2.0），否则沿用 project.yml 里的版本
          version_args=()
          if [ "$REF_TYPE" = tag ]; then version_args=("MARKETING_VERSION=${TAG#v}"); fi
          xcodebuild build \
            -project EseatenMusic.xcodeproj \
            -scheme EseatenMusic \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            "${version_args[@]}"

      - name: Package
        run: ditto -c -k --keepParent "build/Build/Products/Release/Eseaten Music.app" EseatenMusic.zip

      # 已经用 ditto 打好 zip（保留 .app 的符号链接和可执行权限），直接上传，不再套一层
      - uses: actions/upload-artifact@v7
        with:
          path: EseatenMusic.zip
          archive: false

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: EseatenMusic.zip
          skip-decompress: true

      # 带“-”的 tag（如 v0.2.0-beta.1）发成预发布版本
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          ls -l EseatenMusic.zip
          prerelease=()
          if [[ "$TAG" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$TAG" EseatenMusic.zip --verify-tag --generate-notes "${prerelease[@]}"
