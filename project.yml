name: EseatenMusic
options:
  bundleIdPrefix: com.eseaten
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  EseatenMusic:
    type: application
    platform: macOS
    sources:
      - EseatenMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eseaten.music
        PRODUCT_NAME: Eseaten Music
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Eseaten Music
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
